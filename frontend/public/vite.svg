<svg
  xmlns="http://www.w3.org/2000/svg"
  width="32"
  height="32"
  viewBox="0 0 64 64"
  role="img"
  aria-hidden="true"
>
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGradient)" />

  <!-- Calendar body -->
  <rect x="16" y="20" width="32" height="28" rx="6" fill="#ffffff" />
  <rect x="16" y="20" width="32" height="8" rx="6" fill="#3b82f6" />

  <!-- Calendar rings -->
  <rect x="22" y="14" width="4" height="8" rx="2" fill="#1d4ed8" />
  <rect x="38" y="14" width="4" height="8" rx="2" fill="#1d4ed8" />

  <!-- Clock -->
  <circle cx="32" cy="38" r="7" fill="#10b981" />
  <line x1="32" y1="38" x2="32" y2="34" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="36" y2="40" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
</svg>
